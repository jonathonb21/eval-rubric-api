[project]
name = "eval-rubric-api"
version = "0.4.0"
description = "FastAPI rubric scoring with templates, aggregation, export, and inspect metadata"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jonathon Brunson", email = "jonathonbrunson21@gmail.com" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eval_rubric_api = ["examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
